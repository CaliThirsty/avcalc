name: Build Android APK

# Runs whenever you push new changes, or when you click "Run workflow" manually
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repo files onto the cloud machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js (needed to run Capacitor)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install Java 17 (needed to run the Android compiler)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 4: Install Android SDK & Command Line Tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 5: Wrap your index.html into a native Android WebView project
      - name: Create Web App Wrapper
        run: |
          mkdir www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "FlightCalc" "com.flight.calc" --web-dir www
          npx cap add android

      # Step 6: Compile the Java & HTML code into an Android APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # Step 7: Make the APK downloadable from the GitHub page
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlightCalculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
